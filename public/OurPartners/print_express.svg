<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
    <defs>
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&amp;family=Great+Vibes&amp;family=Montserrat:ital,wght@0,300;0,400;0,700;0,900;1,700&amp;family=Playfair+Display:ital,wght@0,400;0,700;1,400&amp;family=Dancing+Script:wght@700&amp;family=Alex+Brush&amp;family=Fredoka+One&amp;display=swap');
        text { dominant-baseline: middle; text-anchor: middle; }
        .cinzel { font-family: 'Cinzel', serif; }
        .playfair { font-family: 'Playfair Display', serif; }
        .montserrat { font-family: 'Montserrat', sans-serif; }
        .great-vibes { font-family: 'Great Vibes', cursive; }
        .dancing { font-family: 'Dancing Script', cursive; }
        .alex-brush { font-family: 'Alex Brush', cursive; }
        .fredoka { font-family: 'Fredoka One', cursive; }
      </style>
    </defs>
    
    <g>
      <!-- Bold red speed lines -->
      <path d="M 120 100 L 150 100 M 115 115 L 145 115 M 110 130 L 140 130" stroke="#d61e24" stroke-width="8" stroke-linecap="square"/>
      <text x="230" y="110" class="montserrat" font-size="44" font-weight="900" font-style="italic" fill="#1a1a1a">PRINT</text>
      <text x="230" y="150" class="montserrat" font-size="38" font-weight="900" font-style="italic" fill="#d61e24">EXPRESS</text>
      <text x="230" y="180" class="playfair" font-size="14" font-style="italic" font-weight="700" fill="#555">Imprint Everything</text>
    </g>
  
  </svg>